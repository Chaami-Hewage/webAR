<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>Atelier De Magie | WebAR</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <!-- A-Frame and AR.js CDN -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>



  <style>
    /* Design Tokens */
    :root {
      --bg-dark: #0f0c1d;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-glow: rgba(212, 175, 55, 0.4);
      --glass-bg: rgba(15, 12, 29, 0.75);
      --glass-border: rgba(212, 175, 55, 0.3);
      --font-header: 'Cinzel', serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-body);
      background: transparent !important;
      color: #ffffff;
    }

    /* Video element inserted by AR.js */
    video, #arjs-video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 1 !important;
    }

    /* A-Frame 3D WebGL Canvas */
    .a-canvas {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 2 !important;
      background: transparent !important;
    }




    /* UI Overlay Layer */
    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    /* Allow interactive elements to receive clicks */
    .interactive {
      pointer-events: auto;
    }

    /* 1. Header Bar */
    header {
      width: 100%;
      max-width: 480px;
      padding: 16px 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 15px var(--gold-glow);
    }

    header h1 {
      font-family: var(--font-header);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, var(--gold-light) 50%, var(--gold-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px var(--gold-glow);
    }

    /* 2. Target Scanner Reticle */
    #reticle-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .reticle-box {
      width: 100%;
      height: 100%;
      border: 2px dashed var(--gold-primary);
      border-radius: 16px;
      box-shadow: 0 0 15px var(--gold-glow), inset 0 0 15px var(--gold-glow);
      animation: pulse 2.5s infinite ease-in-out;
      position: relative;
    }

    .reticle-corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--gold-light);
      border-style: solid;
    }

    .top-left {
      top: -2px;
      left: -2px;
      border-width: 3px 0 0 3px;
      border-top-left-radius: 6px;
    }

    .top-right {
      top: -2px;
      right: -2px;
      border-width: 3px 3px 0 0;
      border-top-right-radius: 6px;
    }

    .bottom-left {
      bottom: -2px;
      left: -2px;
      border-width: 0 0 3px 3px;
      border-bottom-left-radius: 6px;
    }

    .bottom-right {
      bottom: -2px;
      right: -2px;
      border-width: 0 3px 3px 0;
      border-bottom-right-radius: 6px;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.6;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.03);
      }
    }

    /* 3. Central Hero Card Overlay */
    #hero-card-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 12, 29, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 10000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      pointer-events: auto;
    }

    #hero-card-wrapper.dismissed {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .hero-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6), 0 0 30px var(--gold-glow);
    }

    .hero-card h2 {
      font-family: var(--font-header);
      font-size: 1.8rem;
      color: var(--gold-light);
      margin-bottom: 12px;
      letter-spacing: 1.5px;
    }

    .hero-card p {
      font-size: 0.95rem;
      color: #d1d5db;
      line-height: 1.6;
      font-weight: 300;
    }

    /* Responsive visibility toggles */
    .desktop-only { display: block; }
    .mobile-only { display: none; }

    @media (max-width: 768px) {
      .desktop-only { display: none !important; }
      .mobile-only { display: block !important; }
    }

    .btn-gold {
      background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
      color: #0f0c1d;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 14px 32px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--gold-glow);
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(212, 175, 55, 0.6);
      background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 100%);
    }

    .btn-gold:active {
      transform: translateY(1px);
    }

    /* 4. Footer Attribution */
    footer {
      width: 100%;
      max-width: 480px;
      padding: 10px 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      text-align: center;
      font-size: 0.75rem;
      color: #a0aec0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    footer a {
      color: var(--gold-light);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- UI Overlay -->
  <div id="ui-container">
    <!-- Header -->
    <header class="interactive">
      <h1>Atelier De Magie</h1>
    </header>

    <!-- Target Scanner Reticle -->
    <div id="reticle-container">
      <div class="reticle-box">
        <div class="reticle-corner top-left"></div>
        <div class="reticle-corner top-right"></div>
        <div class="reticle-corner bottom-left"></div>
        <div class="reticle-corner bottom-right"></div>
      </div>
    </div>

    <!-- Desktop QR Code & Hiro Marker Target -->
    <div id="hero-card-wrapper" class="desktop-only">
      <div class="hero-card">
        <h2>Call The Magician</h2>
        <p style="margin-bottom: 8px;">1. Scan QR code on your <strong>Phone Camera</strong>:</p>
        <div style="margin: 4px 0 12px 0; background: #ffffff; padding: 8px; border-radius: 12px; display: inline-block;">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=https://chaami-hewage.github.io/webAR/" alt="Scan to open WebAR on Phone" style="width: 130px; height: 130px; display: block; margin: 0 auto;">
        </div>

        <p style="margin-bottom: 8px; font-size: 0.85rem; color: var(--gold-light);">2. Point your Phone Camera at this <strong>Hiro Marker</strong>:</p>
        <div style="margin: 4px 0; background: #ffffff; padding: 12px; border-radius: 12px; display: inline-block;">
          <img src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="Hiro Marker Target" style="width: 160px; height: 160px; display: block; margin: 0 auto; border: 2px solid #000;">
        </div>
      </div>
    </div>

    <!-- Footer Attribution -->
    <footer class="interactive">
      3D Asset: <a href="https://poly.pizza/m/8KU4S7I0sL8" target="_blank" rel="noopener noreferrer">'Little Man' by Don
        Carson</a> (CC-BY via Poly Pizza)
    </footer>
  </div>

  <!-- A-Frame WebAR Scene (Markerless Screen AR) -->
  <a-scene embedded 
    arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false;"
    vr-mode-ui="enabled: false" 
    renderer="alpha: true; logarithmicDepthBuffer: true; colorManagement: true; antialias: true;">

    <!-- Asset Management -->
    <a-assets timeout="10000">
      <a-asset-item id="littleManModel" src="little_man.glb"></a-asset-item>
    </a-assets>

    <!-- Ambient & Warm Directional Lighting -->
    <a-entity light="type: ambient; color: #fff5e6; intensity: 1.8"></a-entity>
    <a-entity light="type: directional; color: #ffd700; intensity: 2.2; castShadow: true" position="2 4 2"></a-entity>
    <a-entity light="type: directional; color: #ff8c00; intensity: 1.2" position="-2 2 -2"></a-entity>

    <!-- Interactive 3D Magician Entity (Direct in Camera View, Gesture Controlled) -->
    <a-entity id="magician-container" position="0 -0.8 -2.5">
      <!-- Gold Base Ring -->
      <a-cylinder position="0 0 0" radius="0.8" height="0.04" color="#d4af37" opacity="0.8"
        material="metalness: 0.9; roughness: 0.1; emissive: #d4af37; emissiveIntensity: 0.3">
      </a-cylinder>

      <!-- 3D Magician -->
      <a-entity id="magician" gltf-model="#littleManModel" scale="1.5 1.5 1.5" position="0 0.05 0" rotation="0 0 0">
      </a-entity>

      <!-- Warm Golden Light Glow -->
      <a-light type="point" color="#ffd700" intensity="2" distance="4" position="0 1 0"></a-light>
    </a-entity>

    <!-- AR Camera -->
    <a-entity camera></a-entity>
  </a-scene>

  <!-- Interactive Gesture Controls Script (Touch drag to move/rotate, pinch to scale) -->
  <script>
    const magicianContainer = document.getElementById('magician-container');
    const magician = document.getElementById('magician');

    let isDragging = false;
    let previousTouchX = 0;
    let previousTouchY = 0;
    let initialPinchDistance = null;
    let currentScale = 1.5;
    let currentRotationY = 0;
    let posX = 0;
    let posY = -0.8;

    // Auto rotate toggle variable
    let autoRotate = true;

    function animateAutoRotate() {
      if (autoRotate && magician) {
        currentRotationY += 0.5;
        magician.setAttribute('rotation', `0 ${currentRotationY} 0`);
      }
      requestAnimationFrame(animateAutoRotate);
    }
    animateAutoRotate();

    // Touch Event Listeners for Mobile & Laptop Mouse
    window.addEventListener('touchstart', (e) => {
      autoRotate = false; // pause auto rotation when user interacts
      if (e.touches.length === 1) {
        isDragging = true;
        previousTouchX = e.touches[0].clientX;
        previousTouchY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        // Pinch zoom start
        initialPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        const deltaX = e.touches[0].clientX - previousTouchX;
        const deltaY = e.touches[0].clientY - previousTouchY;

        // One-finger drag: Rotate horizontally, shift vertically
        currentRotationY += deltaX * 0.5;
        posY -= deltaY * 0.003;

        // Clamp Y position within comfortable view
        posY = Math.max(-2.0, Math.min(1.0, posY));

        magician.setAttribute('rotation', `0 ${currentRotationY} 0`);
        magicianContainer.setAttribute('position', `${posX} ${posY} -2.5`);

        previousTouchX = e.touches[0].clientX;
        previousTouchY = e.touches[0].clientY;
      } else if (e.touches.length === 2 && initialPinchDistance) {
        // Two-finger pinch: Scale 3D Magician
        const newPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = newPinchDistance / initialPinchDistance;

        currentScale = Math.max(0.4, Math.min(4.0, currentScale * factor));
        magician.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);

        initialPinchDistance = newPinchDistance;
      }
    });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isDragging = false;
        initialPinchDistance = null;
      }
    });

    // Laptop Mouse Drag & Scroll Support
    let isMouseDown = false;
    let mouseX = 0;

    window.addEventListener('mousedown', (e) => {
      autoRotate = false;
      isMouseDown = true;
      mouseX = e.clientX;
    });

    window.addEventListener('mousemove', (e) => {
      if (isMouseDown) {
        const deltaX = e.clientX - mouseX;
        currentRotationY += deltaX * 0.5;
        magician.setAttribute('rotation', `0 ${currentRotationY} 0`);
        mouseX = e.clientX;
      }
    });

    window.addEventListener('mouseup', () => { isMouseDown = false; });

    window.addEventListener('wheel', (e) => {
      currentScale = Math.max(0.4, Math.min(4.0, currentScale + (e.deltaY > 0 ? -0.1 : 0.1)));
      magician.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
    });
  </script>
</body>
</html>
